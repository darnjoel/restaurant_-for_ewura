                        <strong style={{ color: '#fff' }}>{orderConfirmed.customer.name} ({orderConfirmed.customer.phone})</strong>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                        <span style={{ color: 'var(--text-muted)' }}>Order Type:</span>
                        <strong style={{ color: 'var(--terracotta-light)' }}>
                          {orderConfirmed.orderType === 'dine-in' ? '🥣 Dine In (Hot Asanka)' : '🥡 Takeaway (Rubber Pack)'}
                        </strong>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                        <span style={{ color: 'var(--text-muted)' }}>Payment:</span>
                        <strong style={{ color: '#fff' }}>
                          {orderConfirmed.customer.paymentMethod === 'momo_mtn' ? 'MTN Mobile Money' :
                           orderConfirmed.customer.paymentMethod === 'momo_telecel' ? 'Telecel / AT Cash' : 'Cash at Counter'}
                        </strong>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', paddingTop: '0.5rem', borderTop: '1px solid var(--border-subtle)' }}>
                        <span style={{ color: 'var(--text-muted)' }}>Total Amount:</span>
                        <strong style={{ color: 'var(--gold-light)', fontSize: '1.2rem' }}>GH₵ {orderConfirmed.total.toFixed(2)}</strong>
                      </div>
                    </div>

                    <p style={{ color: 'var(--gold-light)', fontSize: '0.92rem', marginBottom: '1.5rem' }}>
                      ⏱️ Estimated preparation time: 15 - 25 minutes. We will send an SMS to your phone!
                    </p>

                    <button className="btn btn-primary" onClick={() => { setOrderConfirmed(null); setIsCheckoutOpen(false); }}>
                      Back to Chop Bar
                    </button>
                  </div>
                ) : (
                  <div>
                    <div style={{ marginBottom: '1.5rem' }}>
                      <div className="section-badge" style={{ marginBottom: '0.5rem' }}>Ghanaian Chop Bar Checkout</div>
                      <h3 style={{ fontSize: '1.6rem', color: '#fff', margin: 0 }}>Complete Your Chop Order</h3>
                      <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', marginTop: '0.3rem' }}>
                        Total to pay: <strong style={{ color: 'var(--gold-light)' }}>GH₵ {total.toFixed(2)}</strong> ({orderType === 'dine-in' ? 'Dine In' : 'Takeaway'})
                      </p>
                    </div>

                    <form onSubmit={handleCheckoutSubmit}>
                      <div style={{ display: 'flex', flexDirection: 'column', gap: '1.2rem' }}>
                        <div className="form-group">
                          <label className="form-label">Your Full Name *</label>
                          <input 
                            type="text" 
                            required 
                            className="form-control" 
                            placeholder="e.g. Kojo Antwi" 
                            value={checkoutForm.name}
                            onChange={(e) => setCheckoutForm({ ...checkoutForm, name: e.target.value })}
                          />
                        </div>

                        <div className="form-group">
                          <label className="form-label">Phone Number *</label>
                          <input 
                            type="tel" 
                            required 
                            className="form-control" 
                            placeholder="024 123 4567" 
                            value={checkoutForm.phone}
                            onChange={(e) => setCheckoutForm({ ...checkoutForm, phone: e.target.value })}
                          />
                        </div>

                        {orderType === 'takeaway' && (
                          <div className="form-group">
                            <label className="form-label">Delivery Address or Pickup Notice *</label>
                            <input 
                              type="text" 
                              required 
                              className="form-control" 
                              placeholder="e.g. House 12, Osu Danquah Circle or 'I am picking up at 1pm'" 
                              value={checkoutForm.location}
                              onChange={(e) => setCheckoutForm({ ...checkoutForm, location: e.target.value })}
                            />
                          </div>
                        )}

                        <div>
                          <label className="form-label" style={{ display: 'block', marginBottom: '0.6rem' }}>
                            Choose Payment Method *
                          </label>
                          <div className="momo-option-grid">
                            <button 
                              type="button" 
                              className={`momo-btn ${checkoutForm.paymentMethod === 'momo_mtn' ? 'active' : ''}`}
                              onClick={() => setCheckoutForm({ ...checkoutForm, paymentMethod: 'momo_mtn' })}
                            >
                              <span style={{ fontSize: '1.3rem' }}>📱</span>
                              <span>MTN MoMo</span>
                            </button>

                            <button 
                              type="button" 
                              className={`momo-btn ${checkoutForm.paymentMethod === 'momo_telecel' ? 'active' : ''}`}
                              onClick={() => setCheckoutForm({ ...checkoutForm, paymentMethod: 'momo_telecel' })}
                            >
                              <span style={{ fontSize: '1.3rem' }}>📲</span>
                              <span>Telecel Cash</span>
                            </button>

                            <button 
                              type="button" 
                              className={`momo-btn ${checkoutForm.paymentMethod === 'cash' ? 'active' : ''}`}
                              onClick={() => setCheckoutForm({ ...checkoutForm, paymentMethod: 'cash' })}
                            >
                              <span style={{ fontSize: '1.3rem' }}>💵</span>
                              <span>Cash on Pickup</span>
                            </button>
                          </div>

                          {checkoutForm.paymentMethod.startsWith('momo') && (
                            <div className="form-group" style={{ marginTop: '0.8rem' }}>
                              <label className="form-label">Enter MoMo Wallet Number</label>
                              <input 
                                type="tel" 
                                required 
                                className="form-control" 
                                placeholder="024 000 0000 (A prompt will be sent to your phone)"
                                value={checkoutForm.momoNumber || checkoutForm.phone}
                                onChange={(e) => setCheckoutForm({ ...checkoutForm, momoNumber: e.target.value })}
                              />
                            </div>
                          )}
                        </div>

                        <button type="submit" className="btn btn-primary" disabled={checkoutSubmitting} style={{ marginTop: '0.5rem' }}>
                          {checkoutSubmitting ? 'Placing Order...' : `🍲 Confirm & Place Order (GH₵ ${total.toFixed(2)})`}
                        </button>
                      </div>
                    </form>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* REVIEW MODAL */}
          {isReviewModalOpen && (
            <div className="modal-overlay" onClick={() => setIsReviewModalOpen(false)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <button className="modal-close-btn" onClick={() => setIsReviewModalOpen(false)}>✕</button>

                <div style={{ marginBottom: '1.5rem' }}>
                  <div className="section-badge" style={{ marginBottom: '0.5rem' }}>Chop Bar Impressions</div>
                  <h3 style={{ fontSize: '1.6rem', color: '#fff', margin: 0 }}>Share Your Chop Experience</h3>
                  <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem', marginTop: '0.3rem' }}>
                    How was the fufu, light soup, banku, and Maa Annah's hospitality?
                  </p>
                </div>

                <form onSubmit={handleReviewSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1.2rem' }}>
                  <div className="form-group">
                    <label className="form-label">Your Name *</label>
                    <input 
                      type="text" 
                      required 
                      className="form-control" 
                      placeholder="e.g. Yaw Ofori"
                      value={reviewForm.name}
                      onChange={(e) => setReviewForm({ ...reviewForm, name: e.target.value })}
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">Star Rating</label>
                    <div style={{ display: 'flex', gap: '0.5rem', fontSize: '1.8rem', color: 'var(--gold-light)', cursor: 'pointer' }}>
                      {[1, 2, 3, 4, 5].map((star) => (
                        <span key={star} onClick={() => setReviewForm({ ...reviewForm, rating: star })}>
                          {star <= reviewForm.rating ? '★' : '☆'}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Your Review *</label>
                    <textarea 
                      rows="4" 
                      required 
                      className="form-control" 
                      placeholder="Tell us about the soup, the meat, the hot pepper, or the fufu smoothness..."
                      value={reviewForm.comment}
                      onChange={(e) => setReviewForm({ ...reviewForm, comment: e.target.value })}
                    ></textarea>
                  </div>

                  <button type="submit" className="btn btn-primary" disabled={reviewSubmitting}>
                    {reviewSubmitting ? 'Posting Review...' : '✨ Publish Chop Bar Review'}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
