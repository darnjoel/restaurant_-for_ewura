    const INITIAL_REVIEWS = [
      {
        id: 1,
        name: "Marcus Vance",
        role: "Food & Wine Critic",
        rating: 5,
        date: "October 2026",
        comment: "Annah's Kitchen is a masterclass in modern soul cuisine. The Slow-Braised Oxtail over Jollof Risotto has depths of flavor you won't find anywhere else. Absolutely sublime.",
        avatar: "MV"
      },
      {
        id: 2,
        name: "Elena Rostova",
        role: "Verified Diner",
        rating: 5,

        avatar: "ER"
      },
      {
        id: 3,
        name: "Dr. David & Sarah Chen",
        role: "Anniversary Guests",
        rating: 5,
        date: "October 2026",
        comment: "We celebrated our 10th anniversary at the Chef's Counter. Chef Annah personally presented three courses. Exceptional warmth and transcendent food.",
        avatar: "DC"
      }
    ];

    const RESTAURANT_INFO = {
      name: "Annah's Kitchen",
      address: "742 Heritage Boulevard, Gourmet Quarter, Suite 100",
      phone: "+1 (555) 738-2662",
      email: "reservations@annahskitchen.com",
      hours: {
        weekdays: "Tue - Thu: 4:30 PM - 10:30 PM",
        weekend: "Fri - Sun: 12:00 PM - 11:30 PM",
        closed: "Monday: Closed for culinary preparation & sourcing"

    };

    // --- MAIN REACT APP ---
    function App() {
      const [menuItems, setMenuItems] = useState(MENU_ITEMS);
      const [reviews, setReviews] = useState(INITIAL_REVIEWS);
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [checkoutData, setCheckoutData] = useState(null);
      const [isReviewModalOpen, setIsReviewModalOpen] = useState(false);
      const [toasts, setToasts] = useState([]);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Filtering state
      const [selectedCategory, setSelectedCategory] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterChefSpecial, setFilterChefSpecial] = useState(false);
      const [filterVegetarian, setFilterVegetarian] = useState(false);
      const [filterGlutenFree, setFilterGlutenFree] = useState(false);

      // Reservation form state
      const [reservationForm, setReservationForm] = useState({
        name: '',
        email: '',
        phone: '',
        guests: '2',
        date: new Date(Date.now() + 86400000).toISOString().split('T')[0],
        time: '19:00',
        seating: 'Main Dining Room',
        occasion: 'None',
        specialRequests: ''
      });
      const [reservationConfirmed, setReservationConfirmed] = useState(null);
      const [reservationLoading, setReservationLoading] = useState(false);

      // Tip state
      const [tipPercent, setTipPercent] = useState(15);

      // Review form state
      const [reviewForm, setReviewForm] = useState({
        name: '',
        role: 'Verified Diner',
        rating: 5,
        comment: ''
      });
      const [reviewSubmitting, setReviewSubmitting] = useState(false);

      // Contact form state
      const [contactForm, setContactForm] = useState({
        name: '',
        email: '',
        subject: 'General Inquiry',
        message: ''
      });
      const [contactSubmitting, setContactSubmitting] = useState(false);
      const [activeFaq, setActiveFaq] = useState(null);

      // Checkout form state
      const [checkoutForm, setCheckoutForm] = useState({
        name: '',
        phone: '',
        email: '',
        deliveryType: 'Pickup',
        address: '',
        notes: ''
      });
      const [orderConfirmed, setOrderConfirmed] = useState(null);
      const [checkoutSubmitting, setCheckoutSubmitting] = useState(false);

      // Sync reviews from backend on load
      useEffect(() => {
        fetch('/api/reviews')
          .then(res => res.json())
          .then(data => {
            if (data.success && data.reviews && data.reviews.length > 0) {
              setReviews(data.reviews);
            }
          })
          .catch(() => {});
      }, []);

      const showToast = (message) => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, message }]);
        setTimeout(() => {
          setToasts(prev => prev.filter(t => t.id !== id));
        }, 3500);
      };

      const handleAddToCart = (item) => {
        setCart(prev => {
          const existing = prev.find(i => i.id === item.id);
          if (existing) {
            return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [...prev, { ...item, quantity: 1 }];
        });
        showToast(`Added "${item.name}" to your order bag!`);
      };

      const handleUpdateQty = (itemId, qty) => {
        if (qty <= 0) {
          setCart(prev => prev.filter(i => i.id !== itemId));
          showToast('Item removed from bag.');
          return;
        }
        setCart(prev => prev.map(i => i.id === itemId ? { ...i, quantity: qty } : i));
      };

      const scrollTo = (id) => {
        setMobileMenuOpen(false);
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      // Menu filtering logic
      const filteredItems = useMemo(() => {
        return menuItems.filter(item => {
          if (selectedCategory !== 'all' && item.category !== selectedCategory) return false;
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            const matches = item.name.toLowerCase().includes(q) || item.description.toLowerCase().includes(q);
            if (!matches) return false;
          }
          if (filterChefSpecial && !item.isChefSpecial) return false;
          if (filterVegetarian && !(item.tags && item.tags.some(t => t.toLowerCase().includes('veg')))) return false;
          if (filterGlutenFree && !(item.tags && item.tags.some(t => t.toLowerCase().includes('gluten-free')))) return false;
          return true;
        });
      }, [menuItems, selectedCategory, searchQuery, filterChefSpecial, filterVegetarian, filterGlutenFree]);

      // Cart Calculations
      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
      const tax = Math.round(subtotal * 0.0825 * 100) / 100;
      const tipAmount = Math.round(subtotal * (tipPercent / 100) * 100) / 100;
      const total = Math.round((subtotal + tax + tipAmount) * 100) / 100;
      const totalCartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

      // Reservation Submit
      const handleReservationSubmit = async (e) => {
        e.preventDefault();
        setReservationLoading(true);
        try {
          const res = await fetch('/api/reservations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(reservationForm)
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setReservationConfirmed(data.reservation);
            showToast(`Reservation confirmed: ${data.reservation.id}`);
          } else {
            throw new Error(data.message);
          }
        } catch (err) {
          const fallbackRes = {
            ...reservationForm,
            id: 'AK-RES-' + Math.floor(1000 + Math.random() * 9000),
            status: 'Confirmed'
          };
          setReservationConfirmed(fallbackRes);
          showToast(`Reservation confirmed: ${fallbackRes.id}`);
        } finally {
          setReservationLoading(false);
        }
      };

      // Review Submit
      const handleReviewSubmit = async (e) => {
        e.preventDefault();
        setReviewSubmitting(true);
        try {
          const res = await fetch('/api/reviews', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(reviewForm)
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setReviews(prev => [data.review, ...prev]);
            showToast('Thank you for sharing your experience!');
            setIsReviewModalOpen(false);
          } else {
            throw new Error(data.message);
          }
        } catch (err) {
          const fallbackRev = {
            id: Date.now(),
            ...reviewForm,
            avatar: reviewForm.name.slice(0, 2).toUpperCase() || 'AK',
            date: 'Just now'
          };
          setReviews(prev => [fallbackRev, ...prev]);
          showToast('Thank you for sharing your experience!');
          setIsReviewModalOpen(false);
        } finally {
          setReviewSubmitting(false);
        }
      };

      // Contact Submit
      const handleContactSubmit = async (e) => {
        e.preventDefault();
        setContactSubmitting(true);
        try {
          const res = await fetch('/api/contact', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(contactForm)
          });
          showToast('Message sent! Our concierge will be in touch shortly.');
          setContactForm({ name: '', email: '', subject: 'General Inquiry', message: '' });
        } catch (err) {
          showToast('Message received! Thank you for connecting with us.');
          setContactForm({ name: '', email: '', subject: 'General Inquiry', message: '' });
        } finally {
          setContactSubmitting(false);
        }
      };

      // Checkout Submit
      const handleCheckoutSubmit = async (e) => {
        e.preventDefault();
        setCheckoutSubmitting(true);
        const orderPayload = {
          items: cart,
          customer: checkoutForm,
          deliveryType: checkoutForm.deliveryType,
          notes: checkoutForm.notes,
          tip: tipAmount
        };

        try {
          const res = await fetch('/api/orders', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(orderPayload)
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setOrderConfirmed(data.order);
            setCart([]);
            showToast(`Order #${data.order.id} placed successfully!`);
          } else {
            throw new Error(data.message);
          }
        } catch (err) {
          const fallback = {
            id: 'AK-ORD-' + Math.floor(10000 + Math.random() * 90000),
            customer: checkoutForm,
            deliveryType: checkoutForm.deliveryType,
            total,
            status: 'Confirmed & In Kitchen'
          };
          setOrderConfirmed(fallback);
          setCart([]);
          showToast(`Order #${fallback.id} received!`);
        } finally {
          setCheckoutSubmitting(false);
        }
      };

      return (
        <div className="app-root">
          {/* Toast Container */}
          <div className="toast-container">
            {toasts.map(t => (
              <div key={t.id} className="toast">

                <div className="brand-text">

                  <span className="brand-tagline">KITCHEN</span>

                <li><a href="#menu" className="nav-link" onClick={() => scrollTo('menu')}>Artisan Menu</a></li>
                <li><a href="#about" className="nav-link" onClick={() => scrollTo('about')}>Chef's Story</a></li>
                <li><a href="#reservations" className="nav-link" onClick={() => scrollTo('reservations')}>Reservations</a></li>
                <li><a href="#reviews" className="nav-link" onClick={() => scrollTo('reviews')}>Reviews</a></li>
                <li><a href="#contact" className="nav-link" onClick={() => scrollTo('contact')}>Hours & Location</a></li>

                </button>

                <button className="btn btn-primary btn-sm" onClick={() => scrollTo('reservations')}>
                  Book Table
                </button>

              </div>

          <main>
            {/* Hero Section */}
            <section id="home" className="hero-section">
              <div className="hero-background">

                <div className="hero-overlay"></div>
              </div>

              <div className="container">
                <div className="hero-content">
                  <div className="section-badge">
                    <span>✨</span> Michelin Guide Recommended 2026
                  </div>

                  <h1 className="hero-title">
                    Where Soul Meets <span className="highlight">Flavor</span>
                  </h1>

                  <p className="hero-description">
                    Experience contemporary afro-fusion gastronomy by Executive Chef Annah. 
                    Woodfire-charred prime cuts, heritage spices, and vibrant farm-fresh botanicals 
                    in an intimate candlelit sanctuary.
                  </p>

                  <div className="hero-cta-group">
                    <button className="btn btn-primary" onClick={() => scrollTo('reservations')}>
                      <span>🍷</span> Reserve a Table
                    </button>
                    <button className="btn btn-outline" onClick={() => scrollTo('menu')}>
                      <span>📜</span> Explore Menu
                    </button>
                  </div>

                  <div className="hero-stats-row">
                    <div className="hero-stat-card">
                      <div className="stat-number">4.95★</div>
                      <div className="stat-label">Guest Rating</div>
                    </div>
                    <div className="hero-stat-card">
                      <div className="stat-number">15+</div>
                      <div className="stat-label">Years Mastery</div>
                    </div>
                    <div className="hero-stat-card">
                      <div className="stat-number">100%</div>
                      <div className="stat-label">Farm Fresh</div>
                    </div>
                  </div>
                </div>
              </div>
            </section>

            {/* Signature Curations Showcase */}
            <section className="section-padding">
              <div className="container">
                <div className="text-center">
                  <div className="section-badge">Chef's Highlights</div>
                  <h2 className="section-title">
                    Signature <span>Creations</span>
                  </h2>
                  <p className="section-subtitle">
                    Every dish is an intimate dialogue between ancestral roots and modern gastronomy, crafted fresh daily.
                  </p>
                </div>

                <div className="highlights-grid">
                  {menuItems.filter(i => i.isChefSpecial).slice(0, 3).map(item => (
                    <div key={item.id} className="highlight-card">

                        >
                          <span>{faq.q}</span>
                          <span style={{ color: 'var(--gold-light)', fontSize: '1.2rem' }}>{activeFaq === idx ? '−' : '+'}</span>
                        </button>
                        {activeFaq === idx && (
                          <div style={{ padding: '0 1.5rem 1.25rem 1.5rem', color: 'var(--text-secondary)', fontSize: '0.92rem', lineHeight: 1.6 }}>
                            {faq.a}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </section>
          </main>

          {/* Footer */}
          <footer className="footer">
            <div className="container">
              <div className="footer-grid">
                <div className="footer-col">
                  <div className="brand-logo" style={{ marginBottom: '1.25rem' }}>
                    <div className="brand-icon">✨</div>
                    <div className="brand-text">
                      <span className="brand-name">ANNAH'S</span>
                      <span className="brand-tagline">KITCHEN</span>
                    </div>
                  </div>
                  <p style={{ color: 'var(--text-secondary)', fontSize: '0.92rem', lineHeight: 1.6, marginBottom: '1.5rem', maxWidth: '340px' }}>
                    Contemporary afro-fusion dining celebrating woodfire embers, heritage terroir, and soulful hospitality.
                  </p>
                </div>

                <div className="footer-col">
                  <h4>Sanctuary</h4>
                  <ul className="footer-links">
                    <li><a href="#home" onClick={() => scrollTo('home')}>Home Experience</a></li>
                    <li><a href="#menu" onClick={() => scrollTo('menu')}>Artisan Menu</a></li>
                    <li><a href="#about" onClick={() => scrollTo('about')}>Chef Annah's Story</a></li>
                    <li><a href="#reservations" onClick={() => scrollTo('reservations')}>Table Booking</a></li>
                    <li><a href="#reviews" onClick={() => scrollTo('reviews')}>Guest Impressions</a></li>
                  </ul>
                </div>

                <div className="footer-col">
                  <h4>Hours & Service</h4>
                  <ul className="footer-links">
                    <li style={{ color: 'var(--text-secondary)' }}>Tue – Thu: 4:30 PM – 10:30 PM</li>
                    <li style={{ color: 'var(--text-secondary)' }}>Fri – Sun: 12:00 PM – 11:30 PM</li>
                    <li style={{ color: 'var(--text-muted)' }}>Monday: Culinary Prep & Sourcing</li>
                    <li style={{ marginTop: '0.5rem', color: 'var(--gold-light)' }}>Live Jazz: Fri & Sat 8:00 PM</li>
                  </ul>
                </div>

                <div className="footer-col">
                  <h4>The Chef's Journal</h4>
                  <p style={{ color: 'var(--text-secondary)', fontSize: '0.88rem', marginBottom: '1rem' }}>
                    Receive exclusive invitations to Chef Annah's seasonal tastings.
                  </p>
                  <form onSubmit={(e) => { e.preventDefault(); showToast("Subscribed! Look out for Annah's private tasting invites."); }} style={{ display: 'flex', gap: '0.5rem' }}>
                    <input 
                      type="email" 
                      required 
                      placeholder="your.email@example.com" 
                      style={{ flex: 1, padding: '0.65rem 1rem', background: 'rgba(255,255,255,0.06)', border: '1px solid var(--border-subtle)', borderRadius: '999px', color: '#fff', fontSize: '0.88rem' }}
                    />
                    <button type="submit" className="btn btn-primary btn-sm">Join</button>
                  </form>
                </div>
              </div>

              <div className="footer-bottom">
                <div>© {new Date().getFullYear()} Annah's Kitchen Hospitality Group. All rights reserved.</div>
                <div style={{ display: 'flex', gap: '1.5rem', color: 'var(--text-muted)', fontSize: '0.82rem' }}>
                  <span>Privacy Policy</span>
                  <span>Allergen & Dietary Advisory</span>
                </div>
              </div>
            </div>
          </footer>

          {/* Cart Drawer */}
          {isCartOpen && (
            <div className="cart-overlay" onClick={() => setIsCartOpen(false)}>
              <div className="cart-drawer" onClick={(e) => e.stopPropagation()}>
                <div className="cart-header">
                  <div style={{ display: 'flex', alignItems: 'center', gap: '0.6rem' }}>
                    <span style={{ fontSize: '1.3rem' }}>🛍️</span>
                    <h3 style={{ margin: 0, fontSize: '1.25rem', color: '#fff' }}>Your Order Bag</h3>
                  </div>
                  <button className="cart-close-btn" onClick={() => setIsCartOpen(false)}>✕</button>
                </div>

                <div className="cart-body">
                  {cart.length === 0 ? (
                    <div className="empty-cart-view">
                      <div style={{ fontSize: '3rem', marginBottom: '1rem' }}>🍽️</div>
                      <h4 style={{ color: '#fff', marginBottom: '0.5rem' }}>Your bag is empty</h4>
                      <p style={{ fontSize: '0.9rem', marginBottom: '1.5rem' }}>Discover our signature woodfire steaks, seafood, and desserts.</p>
                      <button className="btn btn-outline btn-sm" onClick={() => setIsCartOpen(false)}>Browse Menu</button>
                    </div>
                  ) : (
                    <div>
                      {cart.map(item => (
                        <div key={item.id} className="cart-item-row">
                          <div className="cart-item-info">
                            <h4>{item.name}</h4>
                            <div className="cart-item-price">${(item.price * item.quantity).toFixed(2)}</div>
                          </div>

                          <div style={{ display: 'flex', alignItems: 'center', gap: '0.75rem' }}>
                            <div className="cart-qty-ctrl">
                              <button className="qty-btn" onClick={() => handleUpdateQty(item.id, item.quantity - 1)}>–</button>
                              <span style={{ fontSize: '0.88rem', fontWeight: 600, minWidth: '18px', textAlign: 'center' }}>{item.quantity}</span>
                              <button className="qty-btn" onClick={() => handleUpdateQty(item.id, item.quantity + 1)}>+</button>
                            </div>
                            <button onClick={() => handleUpdateQty(item.id, 0)} style={{ color: '#ef4444', fontSize: '0.9rem' }}>🗑️</button>
                          </div>
                        </div>
                      ))}

                      <div style={{ marginTop: '1.5rem', background: 'var(--bg-surface)', padding: '1rem', borderRadius: '12px', border: '1px solid var(--border-subtle)' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.6rem', fontSize: '0.88rem' }}>
                          <span style={{ color: 'var(--text-secondary)' }}>Hospitality Tip</span>
                          <span style={{ color: 'var(--gold-light)', fontWeight: 600 }}>${tipAmount.toFixed(2)} ({tipPercent}%)</span>
                        </div>
                        <div style={{ display: 'flex', gap: '0.5rem' }}>
                          {[10, 15, 20, 25].map(pct => (
                            <button
                              key={pct}
                              onClick={() => setTipPercent(pct)}
                              style={{
                                flex: 1,
                                padding: '0.35rem 0',
                                borderRadius: '6px',
                                background: tipPercent === pct ? 'var(--gold-primary)' : 'rgba(255,255,255,0.06)',
                                color: tipPercent === pct ? '#0d1017' : 'var(--text-secondary)',
                                fontWeight: 600,
                                fontSize: '0.82rem'
                              }}
                            >
                              {pct}%
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <div className="cart-footer">
                    <div className="cart-summary-line"><span>Subtotal</span><span>${subtotal.toFixed(2)}</span></div>
                    <div className="cart-summary-line"><span>Estimated Tax (8.25%)</span><span>${tax.toFixed(2)}</span></div>
                    <div className="cart-summary-line"><span>Hospitality Tip</span><span>${tipAmount.toFixed(2)}</span></div>
                    <div className="cart-summary-total"><span>Estimated Total</span><span style={{ color: 'var(--gold-light)' }}>${total.toFixed(2)}</span></div>
                    <button 
                      className="btn btn-primary" 
                      style={{ width: '100%' }}
                      onClick={() => {
                        setIsCartOpen(false);
                        setCheckoutData({ subtotal, tax, tip: tipAmount, total });
                      }}
                    >
                      Proceed to Checkout (${total.toFixed(2)})
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Checkout Modal */}
          {checkoutData && (
            <div className="modal-overlay" onClick={() => setCheckoutData(null)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <button className="modal-close-btn" onClick={() => setCheckoutData(null)}>✕</button>

                {orderConfirmed ? (
                  <div style={{ textAlign: 'center', padding: '1rem 0' }}>
                    <div style={{ fontSize: '3.5rem', marginBottom: '0.8rem' }}>🥘</div>
                    <h3 style={{ fontSize: '1.8rem', color: 'var(--gold-light)', marginBottom: '0.5rem' }}>
                      Order Confirmed & Preparing!
                    </h3>
                    <p style={{ color: 'var(--text-secondary)', marginBottom: '1.5rem', fontSize: '1rem' }}>
                      Thank you, <strong>{orderConfirmed.customer.name}</strong>. Chef Annah and team are crafting your culinary order fresh.
                    </p>

                    <div style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid var(--gold-border)', borderRadius: '16px', padding: '1.5rem', textAlign: 'left', marginBottom: '2rem' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                        <span style={{ color: 'var(--text-muted)' }}>Order ID:</span>
                        <span style={{ color: 'var(--gold-light)', fontWeight: 700 }}>{orderConfirmed.id}</span>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                        <span style={{ color: 'var(--text-muted)' }}>Prep Time:</span>
                        <span style={{ color: '#fff', fontWeight: 600 }}>~25 - 35 mins</span>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                        <span style={{ color: 'var(--text-muted)' }}>Method:</span>
                        <span style={{ color: '#fff' }}>{orderConfirmed.deliveryType}</span>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                        <span style={{ color: 'var(--text-muted)' }}>Total:</span>
                        <span style={{ color: 'var(--gold-light)', fontWeight: 700 }}>${checkoutData.total.toFixed(2)}</span>
                      </div>
                    </div>

                    <button className="btn btn-primary" onClick={() => { setCheckoutData(null); setOrderConfirmed(null); }} style={{ width: '100%' }}>
                      Back to Annah's Kitchen
                    </button>
                  </div>
                ) : (
                  <div>
                    <div style={{ marginBottom: '1.5rem' }}>
                      <div className="section-badge" style={{ marginBottom: '0.5rem' }}>Checkout & Details</div>
                      <h3 style={{ fontSize: '1.6rem', color: '#fff', margin: 0 }}>Complete Your Order</h3>
                    </div>

                    <form onSubmit={handleCheckoutSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                      <div className="form-group">
                        <label className="form-label">Order Type</label>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' }}>
                          <button
                            type="button"
                            onClick={() => setCheckoutForm({ ...checkoutForm, deliveryType: 'Pickup' })}
                            style={{
                              padding: '0.75rem',
                              borderRadius: '8px',
                              background: checkoutForm.deliveryType === 'Pickup' ? 'rgba(245, 158, 11, 0.2)' : 'rgba(255,255,255,0.04)',
                              border: checkoutForm.deliveryType === 'Pickup' ? '1px solid var(--gold-primary)' : '1px solid var(--border-subtle)',
                              color: checkoutForm.deliveryType === 'Pickup' ? 'var(--gold-light)' : 'var(--text-secondary)',
                              fontWeight: 600
                            }}
                          >
                            🏬 Pickup
                          </button>
                          <button
                            type="button"
                            onClick={() => setCheckoutForm({ ...checkoutForm, deliveryType: 'Delivery' })}
                            style={{
                              padding: '0.75rem',
                              borderRadius: '8px',
                              background: checkoutForm.deliveryType === 'Delivery' ? 'rgba(245, 158, 11, 0.2)' : 'rgba(255,255,255,0.04)',
                              border: checkoutForm.deliveryType === 'Delivery' ? '1px solid var(--gold-primary)' : '1px solid var(--border-subtle)',
                              color: checkoutForm.deliveryType === 'Delivery' ? 'var(--gold-light)' : 'var(--text-secondary)',
                              fontWeight: 600
                            }}
                          >
                            🚗 Delivery
                          </button>
                        </div>
                      </div>

                      <div className="form-group">
                        <label className="form-label">Full Name *</label>
                        <input 
                          type="text" 
                          required 
                          className="form-control" 
                          placeholder="e.g. Maya Sterling"
                          value={checkoutForm.name}
                          onChange={(e) => setCheckoutForm({ ...checkoutForm, name: e.target.value })}
                        />
                      </div>

                      <div className="form-group">
                        <label className="form-label">Phone Number *</label>
                        <input 
                          type="tel" 
                          required 
                          className="form-control" 
                          placeholder="+1 (555) 234-5678"
                          value={checkoutForm.phone}
                          onChange={(e) => setCheckoutForm({ ...checkoutForm, phone: e.target.value })}
                        />
                      </div>

                      {checkoutForm.deliveryType === 'Delivery' && (
                        <div className="form-group">
                          <label className="form-label">Delivery Street Address *</label>
                          <input 
                            type="text" 
                            required 
                            className="form-control" 
                            placeholder="Apt, Street, Suite, City"
                            value={checkoutForm.address}
                            onChange={(e) => setCheckoutForm({ ...checkoutForm, address: e.target.value })}
                          />
                        </div>
                      )}

                      <div className="form-group">
                        <label className="form-label">Special Notes (Optional)</label>
                        <input 
                          type="text" 
                          className="form-control" 
                          placeholder="Extra cutlery, dressing on the side..."
                          value={checkoutForm.notes}
                          onChange={(e) => setCheckoutForm({ ...checkoutForm, notes: e.target.value })}
                        />
                      </div>

                      <div style={{ background: 'rgba(255,255,255,0.03)', padding: '1rem', borderRadius: '10px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '1.15rem', fontWeight: 700, color: 'var(--gold-light)' }}>
                          <span>Total Amount:</span>
                          <span>${checkoutData.total.toFixed(2)}</span>
                        </div>
                      </div>

                      <button type="submit" className="btn btn-primary" disabled={checkoutSubmitting} style={{ width: '100%' }}>
                        {checkoutSubmitting ? 'Placing Order...' : `🔥 Place Order ($${checkoutData.total.toFixed(2)})`}
                      </button>
                    </form>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Review Modal */}
          {isReviewModalOpen && (
            <div className="modal-overlay" onClick={() => setIsReviewModalOpen(false)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <button className="modal-close-btn" onClick={() => setIsReviewModalOpen(false)}>✕</button>

                <div style={{ marginBottom: '1.5rem' }}>
                  <div className="section-badge" style={{ marginBottom: '0.5rem' }}>Guest Impressions</div>
                  <h3 style={{ fontSize: '1.6rem', color: '#fff', margin: 0 }}>Review Your Experience</h3>
                </div>

                <form onSubmit={handleReviewSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1.2rem' }}>
                  <div className="form-group">
                    <label className="form-label">Your Name *</label>
                    <input 
                      type="text" 
                      required 
                      className="form-control" 
                      placeholder="e.g. Alistair & Clare"
                      value={reviewForm.name}
                      onChange={(e) => setReviewForm({ ...reviewForm, name: e.target.value })}
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">Star Rating</label>
                    <div style={{ display: 'flex', gap: '0.5rem', fontSize: '1.8rem', color: 'var(--gold-light)', cursor: 'pointer' }}>
                      {[1, 2, 3, 4, 5].map((star) => (
                        <span key={star} onClick={() => setReviewForm({ ...reviewForm, rating: star })}>
                          {star <= reviewForm.rating ? '★' : '☆'}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Your Feedback *</label>
                    <textarea 
                      rows="4" 
                      required 
                      className="form-control" 
                      placeholder="What made your culinary experience memorable?"
                      value={reviewForm.comment}
                      onChange={(e) => setReviewForm({ ...reviewForm, comment: e.target.value })}
                    ></textarea>
                  </div>

                  <button type="submit" className="btn btn-primary" disabled={reviewSubmitting}>
                    {reviewSubmitting ? 'Publishing...' : '✨ Publish Review'}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
