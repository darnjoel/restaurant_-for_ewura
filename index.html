/* =========================================================
   ANNAH'S KITCHEN - LUXURY ARTISANAL RESTAURANT DESIGN SYSTEM
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,600&display=swap');

:root {
  --font-heading: 'Playfair Display', Georgia, serif;
  --font-brand: 'Cinzel', serif;
  --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;

  /* Colors */
  --bg-deep: #080a0e;
  --bg-main: #0d1017;
  --bg-card: rgba(20, 24, 34, 0.78);
  --bg-card-hover: rgba(28, 34, 48, 0.88);
  --bg-surface: #131722;
  --bg-glass: rgba(13, 16, 23, 0.85);

  --gold-primary: #f59e0b;
  --gold-light: #fbbf24;
  --gold-dark: #b45309;
  --gold-glow: rgba(245, 158, 11, 0.28);
  --gold-border: rgba(245, 158, 11, 0.32);

  --ember-accent: #ea580c;
  --ember-glow: rgba(234, 88, 12, 0.24);

  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #8492a6;
  --text-gold: #fde68a;

  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-card: rgba(255, 255, 255, 0.12);

  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --radius-full: 9999px;

  --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.35);
  --shadow-card: 0 10px 30px -5px rgba(0, 0, 0, 0.6), 0 0 1px 1px rgba(255, 255, 255, 0.08);
  --shadow-gold: 0 10px 30px rgba(245, 158, 11, 0.25);
  --shadow-modal: 0 25px 60px rgba(0, 0, 0, 0.85);

  --transition-fast: 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  --transition-smooth: 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Reset & Base */
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  font-size: 16px;
  color-scheme: dark;
}

body {
  font-family: var(--font-body);
  background-color: var(--bg-main);
  color: var(--text-primary);
  line-height: 1.6;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 15% 10%, rgba(245, 158, 11, 0.05) 0%, transparent 40%),
    radial-gradient(circle at 85% 60%, rgba(234, 88, 12, 0.04) 0%, transparent 45%);
  background-attachment: fixed;
}

/* Typography Utilities */
h1, h2, h3, h4, h5, h6 {
  font-family: var(--font-heading);
  color: var(--text-primary);
  font-weight: 700;
  line-height: 1.25;
}

a {
  color: inherit;
  text-decoration: none;
}

button, input, select, textarea {
  font-family: inherit;
  font-size: 1rem;
}

button {
  cursor: pointer;
  border: none;
  background: none;
}

img {
  max-width: 100%;
  height: auto;
  display: block;
}

/* Container */
.container {
  width: 100%;
  max-width: 1260px;
  margin: 0 auto;
  padding: 0 1.5rem;
}

/* Section Header */
.section-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: rgba(245, 158, 11, 0.12);
  border: 1px solid var(--gold-border);
  color: var(--gold-light);
  font-size: 0.82rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 2px;
  padding: 0.4rem 1.1rem;
  border-radius: var(--radius-full);
  margin-bottom: 1rem;
}

.section-title {
  font-size: clamp(2rem, 4vw, 3.2rem);
  margin-bottom: 1rem;
  color: #fff;
}

.section-title span {
  background: linear-gradient(135deg, var(--gold-light), #f59e0b, #f97316);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.section-subtitle {
  color: var(--text-secondary);
  font-size: 1.1rem;
  max-width: 650px;
  margin: 0 auto 3rem auto;
}

.text-center {
  text-align: center;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  font-weight: 600;
  border-radius: var(--radius-full);
  padding: 0.85rem 1.8rem;
  transition: all var(--transition-fast);
  text-decoration: none;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 60%, #d97706 100%);
  color: #0b0d12;
  box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
  font-weight: 700;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(245, 158, 11, 0.55);
  filter: brightness(1.08);
}

.btn-outline {
  border: 1px solid var(--gold-border);
  color: var(--gold-light);
  background: rgba(245, 158, 11, 0.05);
  backdrop-filter: blur(10px);
}

.btn-outline:hover {
  background: rgba(245, 158, 11, 0.15);
  border-color: var(--gold-light);
  transform: translateY(-2px);
}

.btn-ghost {
  color: var(--text-secondary);
}

.btn-ghost:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.06);
}

.btn-sm {
  padding: 0.5rem 1rem;
  font-size: 0.88rem;
}

/* Navigation Bar */
.navbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(13, 16, 23, 0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border-subtle);
  transition: background var(--transition-smooth);
}

.navbar-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 80px;
}

.brand-logo {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  text-decoration: none;
}

.brand-icon {
  width: 44px;
  height: 44px;
  background: linear-gradient(135deg, #fbbf24, #d97706);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
  box-shadow: var(--shadow-gold);
}

.brand-text {
  display: flex;
  flex-direction: column;
}

.brand-name {
  font-family: var(--font-brand);
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  color: #fff;
}

.brand-tagline {
  font-size: 0.7rem;
  color: var(--gold-light);
  letter-spacing: 2.5px;
  text-transform: uppercase;
  font-weight: 600;
}

.nav-menu {
  display: flex;
  align-items: center;
  gap: 1.8rem;
  list-style: none;
}

.nav-link {
  color: var(--text-secondary);
  font-size: 0.95rem;
  font-weight: 500;
  transition: color var(--transition-fast);
  position: relative;
  padding: 0.5rem 0;
}

.nav-link:hover, .nav-link.active {
  color: var(--gold-light);
}

.nav-link.active::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background: var(--gold-primary);
  border-radius: 2px;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 1rem;
}

.cart-toggle-btn {
  position: relative;
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
  color: var(--text-primary);
  transition: all var(--transition-fast);
}

.cart-toggle-btn:hover {
  background: rgba(245, 158, 11, 0.15);
  border-color: var(--gold-border);
  transform: scale(1.05);
}

.cart-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: linear-gradient(135deg, #ef4444, #dc2626);
  color: #fff;
  font-size: 0.72rem;
  font-weight: 700;
  min-width: 20px;
  height: 20px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
  border: 2px solid var(--bg-main);
  animation: pulse-badge 2s infinite;
}

@keyframes pulse-badge {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}

.hamburger-btn {
  display: none;
  flex-direction: column;
  justify-content: space-around;
  width: 32px;
  height: 32px;
  padding: 4px;
}

.hamburger-btn span {
  width: 100%;
  height: 2px;
  background-color: var(--text-primary);
  border-radius: 2px;
  transition: all 0.3s ease;
}

/* Hero Section */
.hero-section {
  position: relative;
  min-height: 88vh;
  display: flex;
  align-items: center;
  padding: 4rem 0 6rem 0;
  overflow: hidden;
}

.hero-background {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
}

.hero-bg-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.28) contrast(1.15);
  transform: scale(1.02);
  transition: transform 10s ease-out;
}

.hero-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    rgba(13, 16, 23, 0.7) 0%,
    rgba(13, 16, 23, 0.4) 40%,
    rgba(13, 16, 23, 0.95) 90%,
    var(--bg-main) 100%
  );
}

.hero-content {
  position: relative;
  z-index: 2;
  max-width: 820px;
  margin: 0 auto;
  text-align: center;
}

.hero-title {
  font-size: clamp(2.6rem, 5.5vw, 4.8rem);
  font-weight: 800;
  letter-spacing: -0.5px;
  margin-bottom: 1.5rem;
  line-height: 1.15;
}

.hero-title .highlight {
  background: linear-gradient(135deg, #fef08a, #f59e0b, #ea580c);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-description {
  font-size: clamp(1.05rem, 2vw, 1.3rem);
  color: var(--text-secondary);
  line-height: 1.7;
  margin-bottom: 2.5rem;
  max-width: 700px;
  margin-left: auto;
  margin-right: auto;
}

.hero-cta-group {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 1.25rem;
  flex-wrap: wrap;
  margin-bottom: 3.5rem;
}

.hero-stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
  max-width: 750px;
  margin: 0 auto;
  padding: 1.5rem;
  background: rgba(20, 24, 34, 0.65);
  backdrop-filter: blur(14px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-xl);
}

.hero-stat-card {
  text-align: center;
}

.stat-number {
  font-family: var(--font-heading);
  font-size: 2rem;
  font-weight: 700;
  color: var(--gold-light);
  line-height: 1;
  margin-bottom: 0.35rem;
}

.stat-label {
  font-size: 0.82rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1.2px;
  font-weight: 600;
}

/* Signature Highlights Section */
.section-padding {
  padding: 6.5rem 0;
}

.highlights-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 2rem;
}

.highlight-card {
  background: var(--bg-card);
  backdrop-filter: blur(12px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: all var(--transition-smooth);
  display: flex;
  flex-direction: column;
}

.highlight-card:hover {
  transform: translateY(-8px);
  border-color: var(--gold-border);
  box-shadow: var(--shadow-card), var(--shadow-gold);
}

.card-media {
  position: relative;
  height: 220px;
  overflow: hidden;
}

.card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transition: transform 0.6s ease;
}

.highlight-card:hover .card-img {
  transform: scale(1.08);
}

.card-badge-floating {
  position: absolute;
  top: 1rem;
  left: 1rem;
  background: rgba(13, 16, 23, 0.85);
  backdrop-filter: blur(8px);
  border: 1px solid var(--gold-border);
  color: var(--gold-light);
  padding: 0.3rem 0.8rem;
  font-size: 0.75rem;
  font-weight: 700;
  border-radius: var(--radius-full);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.card-price-tag {
  position: absolute;
  bottom: 1rem;
  right: 1rem;
  background: linear-gradient(135deg, #fbbf24, #d97706);
  color: #0d1017;
  font-weight: 800;
  font-size: 1.15rem;
  padding: 0.35rem 0.9rem;
  border-radius: var(--radius-full);
  box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.card-body {
  padding: 1.6rem;
  display: flex;
  flex-direction: column;
  flex-grow: 1;
}

.card-title {
  font-size: 1.35rem;
  margin-bottom: 0.6rem;
  color: #fff;
}

.card-desc {
  color: var(--text-secondary);
  font-size: 0.94rem;
  line-height: 1.6;
  margin-bottom: 1.25rem;
  flex-grow: 1;
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 1rem;
  border-top: 1px solid var(--border-subtle);
}

.card-rating {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  color: var(--gold-light);
  font-size: 0.9rem;
  font-weight: 600;
}

/* Chef Story Section */
.about-section {
  background: linear-gradient(180deg, var(--bg-main) 0%, #11141c 100%);
  position: relative;
  overflow: hidden;
}

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1.1fr;
  gap: 4rem;
  align-items: center;
}

.about-media-wrapper {
  position: relative;
}

.about-img-frame {
  position: relative;
  border-radius: var(--radius-xl);
  overflow: hidden;
  box-shadow: var(--shadow-card);
  border: 1px solid var(--border-subtle);
}

.about-img {
  width: 100%;
  height: 520px;
  object-fit: cover;
  transition: transform 0.8s ease;
}

.about-img-frame:hover .about-img {
  transform: scale(1.04);
}

.about-badge-card {
  position: absolute;
  bottom: -1.5rem;
  right: -1.5rem;
  background: rgba(18, 22, 32, 0.94);
  backdrop-filter: blur(16px);
  border: 1px solid var(--gold-border);
  padding: 1.4rem 1.8rem;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-modal);
  display: flex;
  align-items: center;
  gap: 1rem;
}

.badge-icon-box {
  width: 50px;
  height: 50px;
  background: linear-gradient(135deg, #f59e0b, #b45309);
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
}

.about-quote-box {
  border-left: 3px solid var(--gold-primary);
  padding-left: 1.5rem;
  margin: 1.8rem 0;
  font-family: var(--font-heading);
  font-style: italic;
  font-size: 1.15rem;
  color: var(--text-gold);
}

.chef-signature {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-top: 2rem;
}

.chef-avatar {
  width: 54px;
  height: 54px;
  border-radius: 50%;
  border: 2px solid var(--gold-primary);
  object-fit: cover;
}

.chef-meta h4 {
  font-size: 1.1rem;
  color: #fff;
}

.chef-meta p {
  font-size: 0.85rem;
  color: var(--gold-light);
}

/* Menu Filter Tabs & Controls */
.menu-controls {
  margin-bottom: 2.5rem;
}

.menu-search-bar {
  max-width: 480px;
  margin: 0 auto 2rem auto;
  position: relative;
}

.menu-search-input {
  width: 100%;
  padding: 0.85rem 1.25rem 0.85rem 3rem;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-full);
  color: #fff;
  transition: all var(--transition-fast);
}

.menu-search-input:focus {
  outline: none;
  border-color: var(--gold-primary);
  box-shadow: 0 0 0 3px var(--gold-glow);
}

.search-icon {
  position: absolute;
  left: 1.1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
}

.category-tabs {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  flex-wrap: wrap;
  margin-bottom: 2rem;
}

.category-tab {
  padding: 0.65rem 1.4rem;
  border-radius: var(--radius-full);
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  font-size: 0.92rem;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  transition: all var(--transition-fast);
}

.category-tab:hover {
  background: rgba(245, 158, 11, 0.1);
  color: #fff;
  border-color: var(--gold-border);
}

.category-tab.active {
  background: linear-gradient(135deg, #fbbf24, #d97706);
  color: #0d1017;
  font-weight: 700;
  border-color: transparent;
  box-shadow: var(--shadow-gold);
}

.dietary-filters {
  display: flex;
  justify-content: center;
  gap: 1.5rem;
  flex-wrap: wrap;
  font-size: 0.88rem;
  color: var(--text-muted);
}

.dietary-toggle {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  cursor: pointer;
  user-select: none;
}

.dietary-toggle input {
  accent-color: var(--gold-primary);
  width: 16px;
  height: 16px;
}

/* Menu Grid */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
  gap: 1.75rem;
}

.menu-card {
  background: var(--bg-card);
  backdrop-filter: blur(10px);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  transition: all var(--transition-smooth);
}

.menu-card:hover {
  border-color: var(--gold-border);
  transform: translateY(-4px);
  box-shadow: var(--shadow-card);
}

.menu-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 0.5rem;
}

.menu-item-name {
  font-size: 1.2rem;
  color: #fff;
  font-weight: 600;
}

.menu-item-price {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--gold-light);
  white-space: nowrap;
}

.menu-item-tags {
  display: flex;
  gap: 0.4rem;
  flex-wrap: wrap;
  margin-bottom: 0.75rem;
}

.tag-pill {
  font-size: 0.72rem;
  padding: 0.15rem 0.55rem;
  border-radius: var(--radius-full);
  background: rgba(255, 255, 255, 0.06);
  color: var(--text-muted);
}

.tag-pill.chef {
  background: rgba(245, 158, 11, 0.15);
  color: var(--gold-light);
  border: 1px solid var(--gold-border);
}

.menu-item-desc {
  color: var(--text-secondary);
  font-size: 0.88rem;
  line-height: 1.55;
  margin-bottom: 1.25rem;
  flex-grow: 1;
}

.menu-card-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1px solid var(--border-subtle);
  padding-top: 0.85rem;
}

.menu-meta-info {
  font-size: 0.78rem;
  color: var(--text-muted);
}

.add-bag-btn {
  background: rgba(245, 158, 11, 0.12);
  border: 1px solid var(--gold-border);
  color: var(--gold-light);
  font-weight: 600;
  font-size: 0.85rem;
  padding: 0.45rem 1rem;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  gap: 0.4rem;
  transition: all var(--transition-fast);
}

.add-bag-btn:hover {
  background: linear-gradient(135deg, #fbbf24, #d97706);
  color: #0d1017;

        setToasts(prev => [...prev, { id, message }]);

        }, 3500);
      };

      const handleAddToCart = (item) => {
        setCart(prev => {
          const existing = prev.find(i => i.id === item.id);
          if (existing) {
            return prev.map(i => i.id === item.id ? { ...i, quantity: i.quantity + 1 } : i);
          }
          return [...prev, { ...item, quantity: 1 }];
        });
        showToast(`Added "${item.name}" to your order bag!`);
      };

      const handleUpdateQty = (itemId, qty) => {
        if (qty <= 0) {
          setCart(prev => prev.filter(i => i.id !== itemId));
          showToast('Item removed from bag.');
          return;
        }
        setCart(prev => prev.map(i => i.id === itemId ? { ...i, quantity: qty } : i));
      };

      const scrollTo = (id) => {
        setMobileMenuOpen(false);

        if (el) el.scrollIntoView({ behavior: 'smooth' });
      };

      // Menu filtering logic
      const filteredItems = useMemo(() => {
        return menuItems.filter(item => {
          if (selectedCategory !== 'all' && item.category !== selectedCategory) return false;
          if (searchQuery.trim() !== '') {
            const q = searchQuery.toLowerCase();
            const matches = item.name.toLowerCase().includes(q) || item.description.toLowerCase().includes(q);
            if (!matches) return false;
          }
          if (filterChefSpecial && !item.isChefSpecial) return false;
          if (filterVegetarian && !(item.tags && item.tags.some(t => t.toLowerCase().includes('veg')))) return false;
          if (filterGlutenFree && !(item.tags && item.tags.some(t => t.toLowerCase().includes('gluten-free')))) return false;
          return true;
        });
      }, [menuItems, selectedCategory, searchQuery, filterChefSpecial, filterVegetarian, filterGlutenFree]);

      const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

      const tipAmount = Math.round(subtotal * (tipPercent / 100) * 100) / 100;
      const total = Math.round((subtotal + tax + tipAmount) * 100) / 100;
      const totalCartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

        e.preventDefault();
        setReservationLoading(true);
        try {
          const res = await fetch('/api/reservations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(reservationForm)
          });
          const data = await res.json();
          if (res.ok && data.success) {
            setReservationConfirmed(data.reservation);
            showToast(`Reservation confirmed: ${data.reservation.id}`);
          } else {
            throw new Error(data.message);
          }

          const fallbackRes = {
            ...reservationForm,
            id: 'AK-RES-' + Math.floor(1000 + Math.random() * 9000),
            status: 'Confirmed'

          setReservationLoading(false);

                      Order Confirmed & Preparing!
                    </h3>
                    <p style={{ color: 'var(--text-secondary)', marginBottom: '1.5rem', fontSize: '1rem' }}>
                      Thank you, <strong>{orderConfirmed.customer.name}</strong>. Chef Annah and team are crafting your culinary order fresh.
                    </p>

                    <div style={{ background: 'rgba(255,255,255,0.04)', border: '1px solid var(--gold-border)', borderRadius: '16px', padding: '1.5rem', textAlign: 'left', marginBottom: '2rem' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                        <span style={{ color: 'var(--text-muted)' }}>Order ID:</span>
                        <span style={{ color: 'var(--gold-light)', fontWeight: 700 }}>{orderConfirmed.id}</span>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                        <span style={{ color: 'var(--text-muted)' }}>Prep Time:</span>
                        <span style={{ color: '#fff', fontWeight: 600 }}>~25 - 35 mins</span>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '0.5rem' }}>
                        <span style={{ color: 'var(--text-muted)' }}>Method:</span>
                        <span style={{ color: '#fff' }}>{orderConfirmed.deliveryType}</span>
                      </div>
                      <div style={{ display: 'flex', justifyContent: 'space-between' }}>
                        <span style={{ color: 'var(--text-muted)' }}>Total:</span>
                        <span style={{ color: 'var(--gold-light)', fontWeight: 700 }}>${checkoutData.total.toFixed(2)}</span>
                      </div>
                    </div>

                    <button className="btn btn-primary" onClick={() => { setCheckoutData(null); setOrderConfirmed(null); }} style={{ width: '100%' }}>
                      Back to Annah's Kitchen
                    </button>
                  </div>
                ) : (
                  <div>
                    <div style={{ marginBottom: '1.5rem' }}>
                      <div className="section-badge" style={{ marginBottom: '0.5rem' }}>Checkout & Details</div>
                      <h3 style={{ fontSize: '1.6rem', color: '#fff', margin: 0 }}>Complete Your Order</h3>
                    </div>

                    <form onSubmit={handleCheckoutSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1rem' }}>
                      <div className="form-group">
                        <label className="form-label">Order Type</label>
                        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.75rem' }}>
                          <button
                            type="button"
                            onClick={() => setCheckoutForm({ ...checkoutForm, deliveryType: 'Pickup' })}
                            style={{
                              padding: '0.75rem',
                              borderRadius: '8px',
                              background: checkoutForm.deliveryType === 'Pickup' ? 'rgba(245, 158, 11, 0.2)' : 'rgba(255,255,255,0.04)',
                              border: checkoutForm.deliveryType === 'Pickup' ? '1px solid var(--gold-primary)' : '1px solid var(--border-subtle)',
                              color: checkoutForm.deliveryType === 'Pickup' ? 'var(--gold-light)' : 'var(--text-secondary)',
                              fontWeight: 600
                            }}
                          >
                            🏬 Pickup
                          </button>
                          <button
                            type="button"
                            onClick={() => setCheckoutForm({ ...checkoutForm, deliveryType: 'Delivery' })}
                            style={{
                              padding: '0.75rem',
                              borderRadius: '8px',
                              background: checkoutForm.deliveryType === 'Delivery' ? 'rgba(245, 158, 11, 0.2)' : 'rgba(255,255,255,0.04)',
                              border: checkoutForm.deliveryType === 'Delivery' ? '1px solid var(--gold-primary)' : '1px solid var(--border-subtle)',
                              color: checkoutForm.deliveryType === 'Delivery' ? 'var(--gold-light)' : 'var(--text-secondary)',
                              fontWeight: 600
                            }}
                          >
                            🚗 Delivery
                          </button>
                        </div>
                      </div>

                      <div className="form-group">
                        <label className="form-label">Full Name *</label>
                        <input 
                          type="text" 
                          required 
                          className="form-control" 
                          placeholder="e.g. Maya Sterling"
                          value={checkoutForm.name}
                          onChange={(e) => setCheckoutForm({ ...checkoutForm, name: e.target.value })}
                        />
                      </div>

                      <div className="form-group">
                        <label className="form-label">Phone Number *</label>
                        <input 
                          type="tel" 
                          required 
                          className="form-control" 
                          placeholder="+1 (555) 234-5678"
                          value={checkoutForm.phone}
                          onChange={(e) => setCheckoutForm({ ...checkoutForm, phone: e.target.value })}
                        />
                      </div>

                      {checkoutForm.deliveryType === 'Delivery' && (
                        <div className="form-group">
                          <label className="form-label">Delivery Street Address *</label>
                          <input 
                            type="text" 
                            required 
                            className="form-control" 
                            placeholder="Apt, Street, Suite, City"
                            value={checkoutForm.address}
                            onChange={(e) => setCheckoutForm({ ...checkoutForm, address: e.target.value })}
                          />
                        </div>
                      )}

                      <div className="form-group">
                        <label className="form-label">Special Notes (Optional)</label>
                        <input 
                          type="text" 
                          className="form-control" 
                          placeholder="Extra cutlery, dressing on the side..."
                          value={checkoutForm.notes}
                          onChange={(e) => setCheckoutForm({ ...checkoutForm, notes: e.target.value })}
                        />
                      </div>

                      <div style={{ background: 'rgba(255,255,255,0.03)', padding: '1rem', borderRadius: '10px' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '1.15rem', fontWeight: 700, color: 'var(--gold-light)' }}>
                          <span>Total Amount:</span>
                          <span>${checkoutData.total.toFixed(2)}</span>
                        </div>
                      </div>

                      <button type="submit" className="btn btn-primary" disabled={checkoutSubmitting} style={{ width: '100%' }}>
                        {checkoutSubmitting ? 'Placing Order...' : `🔥 Place Order ($${checkoutData.total.toFixed(2)})`}
                      </button>
                    </form>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Review Modal */}
          {isReviewModalOpen && (
            <div className="modal-overlay" onClick={() => setIsReviewModalOpen(false)}>
              <div className="modal-content" onClick={(e) => e.stopPropagation()}>
                <button className="modal-close-btn" onClick={() => setIsReviewModalOpen(false)}>✕</button>

                <div style={{ marginBottom: '1.5rem' }}>
                  <div className="section-badge" style={{ marginBottom: '0.5rem' }}>Guest Impressions</div>
                  <h3 style={{ fontSize: '1.6rem', color: '#fff', margin: 0 }}>Review Your Experience</h3>
                </div>

                <form onSubmit={handleReviewSubmit} style={{ display: 'flex', flexDirection: 'column', gap: '1.2rem' }}>
                  <div className="form-group">
                    <label className="form-label">Your Name *</label>
                    <input 
                      type="text" 
                      required 
                      className="form-control" 
                      placeholder="e.g. Alistair & Clare"
                      value={reviewForm.name}
                      onChange={(e) => setReviewForm({ ...reviewForm, name: e.target.value })}
                    />
                  </div>

                  <div className="form-group">
                    <label className="form-label">Star Rating</label>
                    <div style={{ display: 'flex', gap: '0.5rem', fontSize: '1.8rem', color: 'var(--gold-light)', cursor: 'pointer' }}>
                      {[1, 2, 3, 4, 5].map((star) => (
                        <span key={star} onClick={() => setReviewForm({ ...reviewForm, rating: star })}>
                          {star <= reviewForm.rating ? '★' : '☆'}
                        </span>
                      ))}
                    </div>
                  </div>

                  <div className="form-group">
                    <label className="form-label">Your Feedback *</label>
                    <textarea 
                      rows="4" 
                      required 
                      className="form-control" 
                      placeholder="What made your culinary experience memorable?"
                      value={reviewForm.comment}
                      onChange={(e) => setReviewForm({ ...reviewForm, comment: e.target.value })}
                    ></textarea>
                  </div>

                  <button type="submit" className="btn btn-primary" disabled={reviewSubmitting}>
                    {reviewSubmitting ? 'Publishing...' : '✨ Publish Review'}
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount to DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
